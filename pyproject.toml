[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwev-bench"
version = "0.1.0"
description = "Reproducible Qwen3-VL action-interface benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.57.1,<5",
  "accelerate>=1.0",
  "huggingface-hub>=0.34,<1",
  "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["qwev_bench*"]
